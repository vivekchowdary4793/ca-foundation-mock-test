<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper 1 — Accounting | HARD SET 3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#18212b}
.header{background:#17365d;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}.header h1{margin:0;font-size:20px}
.wrap{max-width:1150px;margin:18px auto;padding:0 12px}.card{background:#fff;border:1px solid #d8dde5;border-radius:10px;padding:18px;box-shadow:0 2px 5px #0001;margin-bottom:14px}
.top{display:flex;gap:12px;flex-wrap:wrap}.info{flex:1;min-width:280px}.timer{min-width:190px;text-align:center;font-size:26px;font-weight:800}
.notice{background:#fff7df;border-left:5px solid #d99b00;padding:12px;margin:12px 0}.paper-grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
.qbox{border:1px solid #dfe4ea;border-radius:8px;padding:16px;margin:14px 0}.qhead{font-weight:800;margin-bottom:12px}.marks{float:right;background:#eaf1fb;padding:4px 8px;border-radius:5px;font-size:13px}
.option{display:block;padding:11px;margin:8px 0;border:1px solid #cbd2da;border-radius:7px;cursor:pointer}.option:hover{background:#f5f8fc}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#1769aa;color:#fff}.secondary{background:#e8edf3}.danger{background:#b42318;color:#fff}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pbtn{padding:8px 0;border:1px solid #cbd2da;background:#fff;border-radius:5px;cursor:pointer}.answered{background:#d9f2df}.current{outline:2px solid #1769aa}
.result{display:none}.score{font-size:34px;font-weight:800}.correct{border-left:4px solid #18864b;padding:8px}.wrong{border-left:4px solid #b42318;padding:8px}
.linkcard{display:block;text-decoration:none;color:#18212b}.big{font-size:22px;font-weight:800}.sub{color:#53606d;line-height:1.5}.badge{display:inline-block;padding:5px 9px;border-radius:12px;background:#e7eef8;margin:3px}
@media(max-width:850px){.paper-grid{grid-template-columns:1fr}}@media(max-width:700px){.home{grid-template-columns:1fr}}.home{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}</style></head><body>
<div class="header"><h1>Paper 1 — Accounting | HARD SET 3</h1><small>CA Foundation 2026 • HARD SET 3 • SUBJECTIVE • 100 marks • 3 hours</small></div><div class="wrap">
<div class="card"><b>Instructions:</b> Follow the choices. Show full workings/reasoning. No negative marking.</div><div id="paper"></div>
<div class="card"><input id="s" type="number" min="0" max="100" placeholder="Marks /100"> <button onclick="save()">Save Score</button><p id="m"></p></div></div>
<script>const b=[["Q1", "Answer any FIVE — 5 × 4 = 20 marks", ["Explain why a trial balance can agree even when errors exist. Give four examples.", "Distinguish capital expenditure, revenue expenditure and deferred revenue expenditure.", "Explain the effect of inventory valuation on profit and current assets when cost exceeds NRV.", "Explain treatment of outstanding expenses, prepaid expenses, accrued income and income received in advance.", "Distinguish provision and reserve and explain their effect on profit.", "Explain entries when a deposited cheque is dishonoured after collection.", "Explain four qualitative characteristics of useful financial information."]], ["Q2", "Bank Reconciliation — 20 marks", ["Cash-book bank balance ₹2,14,750; cheques issued not presented ₹36,400; cheques deposited not collected ₹28,900; bank charges ₹1,250; direct deposit ₹18,600; interest credited ₹3,450; standing-instruction insurance ₹6,800; dishonoured cheque ₹9,200 plus charges ₹200. Prepare adjusted cash book and BRS."]], ["Q3", "Inventory + Depreciation — 20 marks", ["1,200 units at ₹460 each; freight ₹30,000; normal loss 5%; abnormal loss 25 units; 500 units sold; closing NRV ₹445/unit. Compute closing inventory. Separately, machinery cost ₹7,20,000, installation ₹45,000 and dismantling obligation ₹25,000; depreciation 10% SLM. Compute year-end carrying amount and explain capitalisation."]], ["Q4", "Final Accounts — 20 marks", ["Prepare final accounts after adjustments: closing inventory ₹2,65,000; wages outstanding ₹22,000; insurance prepaid ₹7,500; furniture depreciation ₹15,000; bad debts ₹10,000; provision 5% on adjusted debtors ₹1,40,000; goods withdrawn ₹18,000; interest on capital ₹12,000. Explain the dual effect of each adjustment."]], ["Q5", "Partnership — 20 marks", ["A and B share 3:2. C admitted for 1/5, taking 1/10 from A and 1/10 from B. Goodwill ₹2,50,000. Building +₹70,000, stock −₹25,000, unrecorded liability ₹18,000, general reserve ₹60,000. Prepare Revaluation Account, Capital Accounts, new ratio and goodwill treatment."]]];document.getElementById('paper').innerHTML=b.map(x=>'<div class="card"><h2>'+x[0]+'</h2><b>'+x[1]+'</b>'+x[2].map(q=>'<div class="qbox"><p><b>'+q+'</b></p><textarea style="width:100%;min-height:180px"></textarea></div>').join('')+'</div>').join('');function save(){let x=Number(document.getElementById('s').value);if(x<0||x>100)return alert("Enter 0–100");document.getElementById('m').textContent="Saved "+x+"/100. Minimum required: 40/100."}</script></body></html>
